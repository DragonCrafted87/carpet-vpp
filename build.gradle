plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
String archivesBaseName = project.archives_base_name
def generatedResources = file("build/generated/resources")
repositories {
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/releases"
    }
    maven {
        name = "GnomeCraft"
        url = "https://maven.gnomecraft.net/releases/"
    }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        "vpp" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            modFiles.from(generatedResources)
        }
    }
    runs {
        configureEach { run ->
            if (run.name == "client" || run.name == "server") {
                run.vmArg("-Dvpp.debug=true")
            }
            // The default username is Player plus the current millis, so each launch is a new offline UUID.
            if (run.name == "client") {
                run.programArg("--username")
                run.programArg("Dev")
            }
        }
    }
}
fabricApi {
    configureDataGeneration {
        outputDirectory = generatedResources
        addToResources = false
    }
    configureTests {
        createSourceSet = true
        modId = "vpp-test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "eu.pb4:trinkets:${project.trinkets_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}
test {
    useJUnitPlatform()
}

def fabric_version_short = project.fabric_version.split("\\+")[0]
def minecraft_version_val = project.minecraft_version
def loader_version_val = project.loader_version
def mod_version_val = project.version

processResources {
    inputs.property("version", mod_version_val)
    inputs.property("fabric_version", fabric_version_short)
    inputs.property("minecraft_version", minecraft_version_val)
    inputs.property("loader_version", loader_version_val)
    filesMatching("fabric.mod.json") {
        expand(
            "version": mod_version_val,
            "fabric_version": fabric_version_short,
            "minecraft_version": minecraft_version_val,
            "loader_version": loader_version_val
        )
    }
}
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
// Datagen writes build/generated/resources. That directory is not a processResources
// input, so the jar and the dev runs can depend on runDatagen without a cycle.
tasks.matching { it.name.startsWith("run") && it.name != "runDatagen" }.configureEach {
    dependsOn("runDatagen")
    classpath.from(generatedResources)
}

jar {
    dependsOn("runDatagen")
    from(generatedResources) {
        exclude(".cache/**")
    }
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}"}
    }
}

def releaseBuild = !Boolean.getBoolean("vpp.debug") && project.findProperty("vpp.debug")?.toString() != "true"
gradle.taskGraph.whenReady { graph ->
    if (!releaseBuild && graph.hasTask(tasks.named("build").get())) {
        throw new GradleException(
            "build is the release jar. Do not set -Dvpp.debug or -Pvpp.debug. " +
            "Client and server dev runs set -Dvpp.debug=true themselves."
        )
    }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
task setupRunServer {
    doLast {
        def runDir = file('run')
        runDir.mkdirs()
        def eulaFile = file("${runDir}/eula.txt")
        if (!eulaFile.exists()) {
            eulaFile.text = "eula=true\n"
        }
        def propsFile = new File(runDir, "server.properties")
        if (!propsFile.exists()) {
            def template = file(".devcontainer/server.properties")
            if (!template.exists()) {
                throw new GradleException("Missing ${template}. It is the dev server.properties template.")
            }
            propsFile.bytes = template.bytes
        }
    }
}
tasks.named("runServer").configure {
    dependsOn setupRunServer
}
