plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
String archivesBaseName = project.archives_base_name
repositories {
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/releases"
    }
    maven {
        name = "GnomeCraft"
        url = "https://maven.gnomecraft.net/releases/"
    }
}
loom {
    splitEnvironmentSourceSets()
    mods {
        "vpp" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
fabricApi {
    configureDataGeneration()
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "eu.pb4:trinkets:${project.trinkets_version}"
}

def fabric_version_short = project.fabric_version.split("\\+")[0]
def minecraft_version_val = project.minecraft_version
def loader_version_val = project.loader_version
def mod_version_val = project.version

processResources {
    inputs.property("version", mod_version_val)
    inputs.property("fabric_version", fabric_version_short)
    inputs.property("minecraft_version", minecraft_version_val)
    inputs.property("loader_version", loader_version_val)
    filesMatching("fabric.mod.json") {
        expand(
            "version": mod_version_val,
            "fabric_version": fabric_version_short,
            "minecraft_version": minecraft_version_val,
            "loader_version": loader_version_val
        )
    }
}
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar {
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}"}
    }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
task setupRunServer {
    doLast {
        def runDir = file('run')
        runDir.mkdirs()
        def eulaFile = file("${runDir}/eula.txt")
        if (!eulaFile.exists()) {
            eulaFile.text = "eula=true\n"
        }
        def propsFile = file("${runDir}/server.properties")
        Properties props = new Properties()
        if (propsFile.exists()) {
            props.load(propsFile.newReader())
        } else {
            propsFile.createNewFile()
        }
        props.setProperty("enable-command-block", "true")
        props.setProperty("online-mode", "false")
        props.store(propsFile.newWriter(), null)
    }
}
tasks.named("runServer").configure {
    dependsOn setupRunServer
}
