# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft 26.3 is unobfuscated, so the build does not declare a mappings
# dependency. Names in source are Mojang's official names. Yarn is not published.
minecraft_version=26.3
loader_version=0.20.0
loom_version=1.19.1

# Mod Properties
mod_version=1.0.0
maven_group=dragoncrafted87.vpp
archives_base_name=vpp

# Dependencies
fabric_version=0.163.0+26.3
# Trinkets Updated (eu.pb4). The original Trinkets line stops before 26.3.
trinkets_version=4.2.1+26.3
# Carpet stable for this Minecraft release is v26.3 (fabric-carpet-26.3+v260915).
# This mod does not call Carpet, so that version is not a build dependency.
